name: Launcher scripts

# The launcher scripts are the install path for everyone who cannot debug them, and
# nothing else in the repo exercises them. This runs them end to end on each platform.
on:
  push:
    paths:
      - "start.ps1"
      - "start.sh"
      - "Start.cmd"
      - "setup.ps1"
      - "run.ps1"
      - "requirements.txt"
      - ".github/workflows/launcher.yml"
  pull_request:
  workflow_dispatch:

jobs:
  launch:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04 rather than latest: it is the oldest release still supported, so a
        # failure here is a real signal about older machines.
        os: [windows-latest, ubuntu-22.04, macos-latest]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      # Gives the launchers a supported interpreter to find. Their own discovery logic
      # still runs -- this only makes which version they find deterministic.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # --small keeps CI to the 12 MB model. --no-tray matters: without it the scripts
      # would sit on an interactive prompt.
      - name: Set up (Windows)
        if: runner.os == 'Windows'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File start.ps1 -Small -NoBrowser -NoTray -SetupOnly

      - name: Set up (macOS and Linux)
        if: runner.os != 'Windows'
        run: ./start.sh --small --no-browser --no-tray --setup-only

      - name: Second run must skip setup
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            out="$(powershell -NoProfile -ExecutionPolicy Bypass -File start.ps1 -Small -NoBrowser -NoTray -SetupOnly)"
          else
            out="$(./start.sh --small --no-browser --no-tray --setup-only)"
          fi
          echo "$out"
          # The stamp file should have made this a no-op.
          if echo "$out" | grep -qi "First run"; then
            echo "::error::the stamp file did not prevent a second setup"
            exit 1
          fi

      - name: Launch and smoke test
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -NoProfile -ExecutionPolicy Bypass -File start.ps1 -Small -NoBrowser -NoTray -Port 8123 &
          else
            ./start.sh --small --no-browser --no-tray --port 8123 &
          fi

          for _ in $(seq 1 90); do
            if curl -sf -m 3 http://127.0.0.1:8123/api/health > /dev/null; then break; fi
            sleep 2
          done
          curl -sf -m 5 http://127.0.0.1:8123/api/health

          # The SPA has to be served, not just the API.
          curl -sf -m 10 http://127.0.0.1:8123/ | grep -qi "<html" \
            || { echo "::error::the web UI did not load"; exit 1; }

          # spacy_sm explicitly: the request default is spacy_lg, which --small skips.
          body='{"text":"Contact Jane Doe at jane.doe@example.com","engine":"spacy_sm","default_operator":{"type":"placeholder","params":{}}}'
          result="$(curl -sf -m 120 -X POST http://127.0.0.1:8123/api/redact \
                     -H 'Content-Type: application/json' -d "$body")"
          echo "$result"

          echo "$result" | grep -q "<PERSON_1>" \
            || { echo "::error::PERSON was not redacted"; exit 1; }
          echo "$result" | grep -q "<EMAIL_ADDRESS_1>" \
            || { echo "::error::EMAIL_ADDRESS was not redacted"; exit 1; }

      - name: Report on failure
        if: failure()
        shell: bash
        run: |
          echo "Python candidates on PATH:"
          command -v python3 python || true
          ls -la .venv/.setup-stamp 2>/dev/null && cat .venv/.setup-stamp || echo "no stamp file"
