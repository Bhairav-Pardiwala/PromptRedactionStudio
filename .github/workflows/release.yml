name: Release tray app

# Builds the desktop client on tag push and attaches the binaries to the release.
# GitHub Releases is the source of truth; IT pulls from here and redeploys internally.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            asset: PromptRedactionTray-win-x64.exe
            binary: PromptRedactionTray.exe
          - os: ubuntu-latest
            rid: linux-x64
            asset: PromptRedactionTray-linux-x64
            binary: PromptRedactionTray
          # macOS keeps libSkiaSharp/libHarfBuzzSharp/libAvaloniaNative beside the binary
          # even with PublishSingleFile, so the whole directory has to be archived --
          # shipping the bare binary would produce something that cannot start.
          - os: macos-latest
            rid: osx-arm64
            asset: PromptRedactionTray-osx-arm64.tar.gz
            binary: PromptRedactionTray
            archive: true

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      # Unit tests only: the live-backend tests skip themselves without an instance.
      - name: Test
        run: dotnet test tray.Tests --nologo -v q

      # Without this the executables report whatever the csproj happens to say, which is
      # how every build so far has called itself 1.0.0. A dispatch run has no tag to read.
      - name: Version from the tag
        shell: bash
        run: echo "BUILD_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
        if: startsWith(github.ref, 'refs/tags/')

      - name: Publish
        run: >
          dotnet publish tray
          -c Release
          -r ${{ matrix.rid }}
          --self-contained
          -p:PublishSingleFile=true
          ${{ env.BUILD_VERSION && format('-p:Version={0}', env.BUILD_VERSION) || '' }}
          -o out

      # Windows and Linux genuinely produce one file; macOS does not (see matrix note).
      - name: Package artifact
        shell: bash
        run: |
          rm -f out/*.pdb
          if [ "${{ matrix.archive }}" = "true" ]; then
            chmod +x "out/${{ matrix.binary }}"
            tar -czf "${{ matrix.asset }}" -C out .
            mv "${{ matrix.asset }}" "out/${{ matrix.asset }}"
          else
            mv "out/${{ matrix.binary }}" "out/${{ matrix.asset }}"
          fi
          ls -la out/

      # Free, verifiable provenance -- the binary is provably built from this commit.
      - uses: actions/attest-build-provenance@v1
        with:
          subject-path: out/${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body: |
            Desktop client for Prompt Redaction Studio.

            Point it at your organisation's instance in Settings, then use the hotkeys
            (default Ctrl+Alt+R to redact the clipboard, Ctrl+Alt+U to restore).

            **Windows SmartScreen:** these binaries are not code-signed, so Windows will
            warn on first run. Choose *More info -> Run anyway*, or verify the download
            against `SHA256SUMS` and the build attestation first.
